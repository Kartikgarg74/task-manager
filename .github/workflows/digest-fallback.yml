name: digest fallback (06:00 IST)

# Catch-up only — /internal/digest/fallback is idempotent (see
# app/services/digest.py's existence check), so this is a no-op on a normal
# day where the 23:59 primary already ran.
on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST = 00:30 UTC
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: call /internal/digest/fallback
        run: |
          curl -sf -X POST "${{ secrets.RENDER_BACKEND_URL }}/internal/digest/fallback" \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"
