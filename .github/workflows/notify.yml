name: morning notify (09:30 IST)

# Must run after digest-fallback has had a chance to finish — see the hard
# cron ordering note in README's "Daily digest" section.
on:
  schedule:
    - cron: "0 4 * * *" # 09:30 IST = 04:00 UTC
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: call /internal/notify
        run: |
          curl -sf -X POST "${{ secrets.RENDER_BACKEND_URL }}/internal/notify" \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"
