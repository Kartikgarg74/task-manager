name: digest primary (23:59 IST)

on:
  schedule:
    - cron: "29 18 * * *" # 23:59 IST = 18:29 UTC
  workflow_dispatch: {} # lets you fire it manually from the Actions tab, for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: call /internal/digest/primary
        run: |
          curl -sf -X POST "${{ secrets.RENDER_BACKEND_URL }}/internal/digest/primary" \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"
