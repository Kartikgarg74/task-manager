# Render Blueprint. Free web service tier — sleeps after ~15 min idle, wakes
# on the next request (~30-60s cold start). That's fine here: scheduling is
# external (GitHub Actions cron hits /internal/*, see .github/workflows/),
# not an in-process scheduler that needs continuous uptime. The one honest
# cost of free: an open WebSocket drops if the instance sleeps and takes a
# moment to reconnect on the next visit — no data loss, just a brief lag.
services:
  - type: web
    name: task-manager-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -e ."
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: WEB_AUTH_SECRET
        sync: false
      - key: WEB_AUTH_EMAIL
        sync: false
      - key: WEB_AUTH_PASSWORD_HASH
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
